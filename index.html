<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA NIM Proxy Dashboard</title>
    <style>
        /* ==== EXISTING STYLES (UNCHANGED) ==== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header, .config-section, .results-section, .chat-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1, h2, h3 { color: #667eea; }
        .input-group input { background: #f9fafb; }

        /* ==== MODEL GRID ==== */
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .model-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        .copy-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            margin-right: 8px;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>🚀 NVIDIA NIM Proxy Dashboard</h1>
        <p>Monitor your proxy status, discover available models, and chat with AI</p>
    </div>

    <div class="config-section">
        <button onclick="fetchModels()">🤖 Load Models</button>
    </div>

    <!-- ===== MODELS SECTION ===== -->
    <div class="results-section" id="modelsSection" style="display:none;">
        <h3>Available Models</h3>

        <!-- 🔍 SEARCH BAR (ADDED) -->
        <div class="input-group" style="margin-top:15px;">
            <label>Search Models</label>
            <input
                type="text"
                id="modelSearch"
                placeholder="Search by model name, owner, or type..."
                oninput="filterModels()">
        </div>

        <div id="modelsResults"></div>
    </div>

</div>

<script>
    let availableModels = [];

    async function fetchModels() {
        const baseUrl = document.getElementById('proxyUrl')?.value || '';
        const section = document.getElementById('modelsSection');
        const results = document.getElementById('modelsResults');

        section.style.display = 'block';
        results.innerHTML = 'Loading models...';

        try {
            const res = await fetch(`${baseUrl}/v1/models`);
            const data = await res.json();

            availableModels = data.data || [];
            renderModels(availableModels);
        } catch (e) {
            results.innerHTML = 'Error loading models';
        }
    }

    function renderModels(models) {
        const results = document.getElementById('modelsResults');

        if (!models.length) {
            results.innerHTML = '<p>No models found.</p>';
            return;
        }

        results.innerHTML = `
            <p>✅ Showing ${models.length} models</p>
            <div class="model-grid">
                ${models.map(m => `
                    <div class="model-card">
                        <h4>${m.id}</h4>
                        <p>Owner: ${m.owned_by}</p>
                        <p>Type: ${m.object}</p>
                        <button class="copy-btn" onclick="navigator.clipboard.writeText('${m.id}')">📋 Copy</button>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function filterModels() {
        const q = document.getElementById('modelSearch').value.toLowerCase();
        const filtered = availableModels.filter(m =>
            m.id.toLowerCase().includes(q) ||
            m.owned_by.toLowerCase().includes(q) ||
            m.object.toLowerCase().includes(q)
        );
        renderModels(filtered);
    }
</script>
</body>
</html>
